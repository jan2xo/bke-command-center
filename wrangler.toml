name = "bke-command-center"
main = "src/index.js"
compatibility_date = "2026-10-08"

# The default Worker has no BKE_PREPRODUCTION marker.
# The exported runtime handler fails closed without that marker.
# Do not deploy the default Worker: use the explicit preproduction environment.

[env.preproduction]
# Wrangler deploy --env preproduction resolves a separate Worker named
# bke-command-center-preproduction.
# Do not expose a public workers.dev endpoint; operator must configure a
# protected PREPRODUCTION route before live validation.
workers_dev = false
preview_urls = false

# PREPRODUCTION-only hostname. This is a CUSTOM DOMAIN: Cloudflare
# creates the required DNS/TLS once it is attached during deployment.
# Do not deploy this staged route until the operator has confirmed the
# exact Cloudflare Access application and policy. After the route exists,
# test unauthenticated Access denial BEFORE enabling the runtime latch.
[[env.preproduction.routes]]
pattern = "cc.jl-bke.com"
custom_domain = true

[env.preproduction.vars]
BKE_PREPRODUCTION = "true"
GITHUB_OWNER = "jan2xo"
GITHUB_REPO = "bke-worker"

# Private server-to-server capability, never exposed through public HTTP.
# Must resolve only to the existing PREPRODUCTION BKE Worker relay.
# The relay's named broker RPC remains locked until separately authorized.
[[env.preproduction.services]]
binding = "BKE_GITHUB_READ_BROKER"
service = "bke-worker-relay-preproduction"
entrypoint = "CommandCenterReadBroker"

# DORMANT pairing vault source contract — no enrollment RPC/routes exposed.
# Never deploy without independent PREPRODUCTION security authorization.
[[env.preproduction.durable_objects.bindings]]
name = "BKE_WORKER_PAIRING_VAULT"
class_name = "BkeWorkerPairingVault"

[[env.preproduction.migrations]]
tag = "pairing-vault-sqlite-v1"
new_sqlite_classes = ["BkeWorkerPairingVault"]
