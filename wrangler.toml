name = "bke-command-center"
main = "src/index.js"
compatibility_date = "2026-10-08"

# The default Worker has no BKE_PREPRODUCTION marker.
# The exported runtime handler fails closed without that marker.
# Do not deploy the default Worker: use the explicit preproduction environment.

[env.preproduction]
# Wrangler deploy --env preproduction resolves a separate Worker named
# bke-command-center-preproduction.
# Do not expose a public workers.dev endpoint; operator must configure a
# protected PREPRODUCTION route before live validation.
workers_dev = false

# PREPRODUCTION-only hostname. This is a CUSTOM DOMAIN: Cloudflare
# creates the required DNS/TLS once it is attached during deployment.
# Do not deploy this staged route until the operator has independently
# verified its Cloudflare Access policy, exact host match, and deny test.
[[env.preproduction.routes]]
pattern = "cc.jl-bke.com"
custom_domain = true

[env.preproduction.vars]
BKE_PREPRODUCTION = "true"
GITHUB_OWNER = "jan2xo"
GITHUB_REPO = "bke-worker"
